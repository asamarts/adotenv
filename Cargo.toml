[workspace]
members = ["."]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "adotenv"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
description = "A tooling-grade .env parser: literal values (no variable expansion), exact byte spans, and edits that leave the rest of the file untouched."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"
documentation = "https://docs.rs/adotenv"
keywords = ["dotenv", "env", "parser", "linter", "lossless"]
categories = ["parser-implementations", "config", "development-tools"]
include = ["src/**/*.rs", "benches/**/*.rs", "README.md", "CHANGELOG.md", "ROADMAP.md", "docs/design/*.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = ["std"]
std = []
exec = ["std"]

[dependencies]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
