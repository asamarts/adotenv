[workspace]
members = [
    ".",
    "adotenv-process",
    "adotenv-cli",
    "adotenv-config",
    "adotenv-figment",
]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "adotenv"
version = "0.9.10"
edition = "2021"
rust-version = "1.81"
description = "A tooling-grade .env parser: literal values (no variable expansion), exact byte spans, and edits that leave the rest of the file untouched."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"
documentation = "https://docs.rs/adotenv"
keywords = ["dotenv", "env", "parser", "linter", "lossless"]
categories = ["parser-implementations", "config", "development-tools"]
include = ["src/**/*.rs", "benches/**/*.rs", "README.md", "CHANGELOG.md", "ROADMAP.md", "MIGRATION.md", "docs/design/*.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = []
exec = ["std"]
load = ["std"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
