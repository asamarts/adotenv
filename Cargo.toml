[workspace]
members = [
    ".",
    "adotenv-process",
    "adotenv-cli",
    "adotenv-lint",
    "adotenv-lsp",
    "adotenv-bench",
    "xtask",
    "adotenv-config",
    "adotenv-figment",
]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "adotenv"
version = "1.4.1"
edition = "2021"
rust-version = "1.81"
description = "A tooling-grade .env parser: literal values (no variable expansion), exact byte spans, and edits that leave the rest of the file untouched."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"
documentation = "https://docs.rs/adotenv"
keywords = ["dotenv", "env", "parser", "linter", "lossless"]
categories = ["parser-implementations", "config", "development-tools"]
include = ["/src/**/*.rs", "/benches/**/*.rs", "/README.md", "/CHANGELOG.md", "/ROADMAP.md", "/docs/**/*.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = []
exec = ["std"]
load = ["std"]
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.bench]
strip = false
debug = "line-tables-only"
lto = false
codegen-units = 1
