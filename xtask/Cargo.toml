[package]
name = "adotenv-xtask"
version = "0.0.0"
edition = "2021"
rust-version = "1.81"
publish = false
description = "Benchmark automation for adotenv."
license = "Apache-2.0 OR MIT"

[[bin]]
name = "adotenv-xtask"
path = "src/main.rs"

[dependencies]
adotenv-bench = { path = "../adotenv-bench" }
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
