[package]
name = "adotenv-lsp"
version = "0.6.0"
edition = "2021"
rust-version = "1.81"
description = "Language Server Protocol support for adotenv documents."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"
documentation = "https://docs.rs/adotenv-lsp"
readme = "README.md"
keywords = ["dotenv", "env", "lsp", "language-server", "editor"]
categories = ["development-tools"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["stdio"]
stdio = ["dep:serde", "dep:serde_json"]

[[bin]]
name = "adotenv-lsp"
path = "src/main.rs"
required-features = ["stdio"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["stdio"]

[dependencies]
adotenv = { path = "..", version = "1.7.3" }
adotenv-lint = { path = "../adotenv-lint", version = "0.2.3" }
lsp-types = "0.97"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
