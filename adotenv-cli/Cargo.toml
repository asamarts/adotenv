[package]
name = "adotenv-cli"
version = "1.6.1"
edition = "2021"
rust-version = "1.81"
description = "Command-line tools for reading, checking, formatting and comparing dotenv files."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"
documentation = "https://docs.rs/adotenv-cli"
readme = "README.md"
keywords = ["dotenv", "cli", "formatter", "linter", "env"]
categories = ["command-line-utilities", "development-tools", "config"]
# Keep the published package self-contained. The integration test is shipped
# but skips workspace-level fixture and documentation checks when they are
# absent.
include = ["/src/**", "/tests/cli.rs", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[dependencies]
adotenv = { path = "..", version = "1.6.1", features = ["load"] }

[dev-dependencies]
serde_json = "=1.0.154"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
