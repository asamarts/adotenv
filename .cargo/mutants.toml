# Conservative defaults for mutation runs.
#
# cargo-mutants copies the workspace once per worker and runs the package test
# suite for every mutant. Ignore build/scratch data when copying, cap Cargo's
# build parallelism, and keep the test harness single-threaded. The worker
# count and wall-clock timeout still belong on the command line: use
# `--jobs 1 --timeout 120` locally, or run the campaign on a dedicated validation host or CI.
# See docs/design/heavy-validation.md.
gitignore = true
additional_cargo_args = ["--jobs", "2"]
additional_cargo_test_args = ["--", "--test-threads=1"]
