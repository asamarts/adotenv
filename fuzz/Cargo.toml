[package]
name = "adotenv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]
resolver = "2"

[dependencies]
libfuzzer-sys = "0.4"
adotenv = { path = ".." }
dotenv-compat = "=0.4.0"

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edits"
path = "fuzz_targets/edits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encoding"
path = "fuzz_targets/encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve"
path = "fuzz_targets/resolve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format"
path = "fuzz_targets/format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false
