name: Release

# Publishes to crates.io when a `vX.Y.Z` tag is pushed, keylessly: the job
# mints a short-lived token through crates.io Trusted Publishing (OIDC), so no
# registry token is stored in this repository.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo test --locked
      # Idempotent: a version already on crates.io (published by hand, or by an
      # earlier attempt of this run) is skipped, so re-running the job is safe.
      - name: skip if this version is already published
        id: exists
        env:
          TAG: ${{ github.ref_name }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-release' \
            "https://crates.io/api/v1/crates/adotenv/${TAG#v}")"
          case "$code" in
            200) echo "already=true" >> "$GITHUB_OUTPUT"; echo "::notice::${TAG#v} is already on crates.io; skipping publish" ;;
            404) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io lookup returned HTTP $code"; exit 1 ;;
          esac
      - name: mint a short-lived crates.io token via OIDC
        if: steps.exists.outputs.already == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: crates-auth
      - if: steps.exists.outputs.already == 'false'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
