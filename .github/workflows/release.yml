name: Release

# Publishes the workspace crates when a `vX.Y.Z` tag is pushed.
#
# Existing crates are authenticated through crates.io Trusted Publishing
# (OIDC), so no registry token is stored for normal releases. crates.io does
# not support a pending trusted publisher for a brand-new crate: the first
# publish of each new crate needs a temporary CARGO_REGISTRY_TOKEN secret.
# See RELEASING.md for the one-time bootstrap and verification steps.
#
# `adotenv`, `adotenv-process` and `adotenv-cli` share one version, which must
# match the tag. `adotenv-lint` starts at 0.1.0, and `adotenv-config` and
# `adotenv-figment` keep their own 0.x versions; each independent crate is
# published when its declared version is not on crates.io yet.
#
# Manual dispatch runs the CI quality gate. The `publish_linter` and
# `publish_lsp` inputs can additionally publish those independent 0.x crates
# without a core tag; both paths package, attest and upload their .crate. The
# LSP's first publish uses a temporary bootstrap token because crates.io cannot
# register a trusted publisher for a new crate.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish_linter:
        description: Publish adotenv-lint through crates.io Trusted Publishing
        type: boolean
        default: false
      publish_lsp:
        description: Publish adotenv-lsp (bootstrap token, then OIDC)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: release quality gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      has_assets: ${{ steps.publish_crates.outputs.has_assets }}
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
      attestations: write # Sigstore build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify tag and workspace package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import json
          import subprocess
          import sys

          tag = sys.argv[1]
          expected = [
              "adotenv",
              "adotenv-lint",
              "adotenv-process",
              "adotenv-config",
              "adotenv-figment",
              "adotenv-cli",
          ]
          lockstep = ["adotenv", "adotenv-process", "adotenv-cli"]
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          packages = {package["name"]: package for package in metadata["packages"]}
          missing = [name for name in expected if name not in packages]
          if missing:
              raise SystemExit(f"workspace is missing packages: {', '.join(missing)}")
          version = packages["adotenv"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match adotenv version {version}")
          for name in expected:
              package = packages[name]
              if name in lockstep and package["version"] != version:
                  raise SystemExit(
                      f"{name} is version {package['version']}, expected {version}"
                  )
              if package.get("publish") is not None:
                  raise SystemExit(f"{name} is not publishable")
              print(f"{name} {package['version']}")
          print(f"tag {tag} matches the lockstep version {version}")
          PY

      - name: plan crates.io publishes
        id: plan
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          packages="adotenv adotenv-lint adotenv-process adotenv-config adotenv-figment adotenv-cli"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version() {
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == sys.argv[1]))' "$1" <<<"$metadata"
          }
          pending=""
          oidc_packages=""
          new_packages=""
          for package in $packages; do
            version="$(package_version "$package")"
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-release' \
              "https://crates.io/api/v1/crates/$package/$version")"
            case "$code" in
              200)
                echo "::notice::$package $version is already published"
                ;;
              404)
                crate_code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-release' \
                  "https://crates.io/api/v1/crates/$package")"
                case "$crate_code" in
                  200)
                    pending="$pending $package"
                    oidc_packages="$oidc_packages $package"
                    ;;
                  404)
                    if [[ -z "$BOOTSTRAP_TOKEN" ]]; then
                      echo "::error::$package does not exist on crates.io; Trusted Publishing cannot make its first publish. Add a temporary CARGO_REGISTRY_TOKEN secret (see RELEASING.md)."
                      exit 1
                    fi
                    pending="$pending $package"
                    new_packages="$new_packages $package"
                    ;;
                  *)
                    echo "::error::crates.io crate lookup for $package returned HTTP $crate_code"
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "::error::crates.io version lookup for $package $version returned HTTP $code"
                exit 1
                ;;
            esac
          done
          pending="${pending# }"
          oidc_packages="${oidc_packages# }"
          new_packages="${new_packages# }"
          {
            echo "packages=$pending"
            echo "oidc_packages=$oidc_packages"
            echo "new_packages=$new_packages"
            if [[ -n "$pending" ]]; then
              echo "needs_publish=true"
            else
              echo "needs_publish=false"
            fi
            if [[ -n "$oidc_packages" ]]; then
              echo "needs_oidc=true"
            else
              echo "needs_oidc=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: mint a short-lived crates.io token via OIDC
        if: steps.plan.outputs.needs_oidc == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth

      - name: publish pending crates
        id: publish_crates
        if: steps.plan.outputs.needs_publish == 'true'
        env:
          PACKAGES: ${{ steps.plan.outputs.packages }}
          OIDC_PACKAGES: ${{ steps.plan.outputs.oidc_packages }}
          NEW_PACKAGES: ${{ steps.plan.outputs.new_packages }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          OIDC_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version() {
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == sys.argv[1]))' "$1" <<<"$metadata"
          }

          index_path() {
            local package="$1"
            case "${#package}" in
              1) echo "1/$package" ;;
              2) echo "2/$package" ;;
              3) echo "3/${package:0:1}/$package" ;;
              *) echo "${package:0:2}/${package:2:2}/$package" ;;
            esac
          }

          index_body() {
            local package="$1"
            curl -fsSL --max-time 10 -H 'User-Agent: adotenv-release' \
              "https://index.crates.io/$(index_path "$package")"
          }

          index_checksum() {
            local package="$1"
            local version="$2"
            index_body "$package" | python3 -c '
          import json
          import sys
          version = sys.argv[1]
          for line in sys.stdin:
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if row.get("vers") == version:
                  print(row.get("cksum", ""))
                  break
          ' "$version"
          }

          wait_for_index() {
            local package="$1"
            local version="$2"
            local body=""
            for _ in $(seq 1 90); do
              if body="$(index_body "$package")" \
                && grep -Fq "\"vers\":\"$version\"" <<<"$body"; then
                echo "::notice::$package $version is visible in the sparse index"
                return 0
              fi
              sleep 2
            done
            echo "::error::$package $version did not appear in the sparse index within 180 seconds"
            return 1
          }

          if [[ -n "$NEW_PACKAGES" && -z "$BOOTSTRAP_TOKEN" ]]; then
            echo "::error::A first publish is pending but CARGO_REGISTRY_TOKEN is not set. See RELEASING.md."
            exit 1
          fi
          if [[ -n "$OIDC_PACKAGES" && -z "$OIDC_TOKEN" ]]; then
            echo "::error::Trusted Publishing did not provide a token for: $OIDC_PACKAGES"
            exit 1
          fi

          rm -rf release-assets
          mkdir -p release-assets
          for package in $PACKAGES; do
            version="$(package_version "$package")"
            case " $NEW_PACKAGES " in
              *" $package "*)
                token="$BOOTSTRAP_TOKEN"
                ;;
              *)
                token="$OIDC_TOKEN"
                ;;
            esac
            if [[ -z "$token" ]]; then
              echo "::error::no registry credential is available for $package"
              exit 1
            fi
            echo "::group::Packaging $package $version"
            cargo package -p "$package" --locked
            crate="target/package/${package}-${version}.crate"
            if [[ ! -f "$crate" ]]; then
              echo "::error::cargo package did not produce $crate"
              exit 1
            fi
            cp "$crate" "release-assets/${package}-${version}.crate"
            (cd release-assets && sha256sum "${package}-${version}.crate" > "${package}-${version}.crate.sha256")
            local_checksum="$(sha256sum "$crate" | awk '{print $1}')"
            echo "::endgroup::"
            echo "::group::Publishing $package $version"
            CARGO_REGISTRY_TOKEN="$token" cargo publish -p "$package" --locked
            wait_for_index "$package" "$version"
            remote_checksum="$(index_checksum "$package" "$version")"
            if [[ -z "$remote_checksum" ]]; then
              echo "::error::crates.io index did not report a checksum for $package $version"
              exit 1
            fi
            if [[ "$remote_checksum" != "$local_checksum" ]]; then
              echo "::error::$package $version checksum mismatch: local $local_checksum, crates.io $remote_checksum"
              exit 1
            fi
            echo "::notice::$package $version checksum matches crates.io ($local_checksum)"
            echo "::endgroup::"
          done
          if compgen -G "release-assets/*.crate" >/dev/null; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: attest packaged crates
        if: hashFiles('release-assets/*.crate') != ''
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-assets/*.crate

      - name: upload release crate assets
        if: hashFiles('release-assets/*.crate') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crates
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-linter:
    name: publish adotenv-lint
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.publish_linter == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
      attestations: write # Sigstore build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify the linter version is unpublished
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "adotenv-lint"))'
          )"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: adotenv-release' \
            "https://crates.io/api/v1/crates/adotenv-lint/$version")"
          if [[ "$code" == "200" ]]; then
            echo "::error::adotenv-lint $version is already published"
            exit 1
          fi
          if [[ "$code" != "404" ]]; then
            echo "::error::crates.io lookup for adotenv-lint $version returned HTTP $code"
            exit 1
          fi
          echo "::notice::adotenv-lint $version is unpublished"
      - name: mint a short-lived crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth
      - name: package, publish and verify adotenv-lint
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: bash scripts/release-publish-crate.sh adotenv-lint
      - name: attest packaged linter crate
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-assets/*.crate
      - name: upload linter release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crates-linter
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-lsp:
    name: publish adotenv-lsp
    needs: [checks, publish-linter]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_lsp == true &&
      needs.checks.result == 'success' &&
      (needs.publish-linter.result == 'success' || needs.publish-linter.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing after bootstrap
      attestations: write # Sigstore build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify the lsp version and crate state
        id: check
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "adotenv-lsp"))'
          )"
          code="$(curl -sS -o /dev/null -w '%{http_code}'             -H 'User-Agent: adotenv-release'             "https://crates.io/api/v1/crates/adotenv-lsp/$version")"
          if [[ "$code" == "200" ]]; then
            echo "::error::adotenv-lsp $version is already published"
            exit 1
          fi
          if [[ "$code" != "404" ]]; then
            echo "::error::crates.io version lookup for adotenv-lsp $version returned HTTP $code"
            exit 1
          fi
          crate_code="$(curl -sS -o /dev/null -w '%{http_code}'             -H 'User-Agent: adotenv-release'             "https://crates.io/api/v1/crates/adotenv-lsp")"
          case "$crate_code" in
            200)
              echo "crate_exists=true" >> "$GITHUB_OUTPUT"
              echo "::notice::adotenv-lsp exists; publish will use OIDC"
              ;;
            404)
              echo "crate_exists=false" >> "$GITHUB_OUTPUT"
              echo "::notice::adotenv-lsp is a first publish; a bootstrap token is required"
              ;;
            *)
              echo "::error::crates.io crate lookup for adotenv-lsp returned HTTP $crate_code"
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: mint a short-lived crates.io token via OIDC
        if: steps.check.outputs.crate_exists == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth
      - name: package, publish and verify adotenv-lsp
        env:
          VERSION: ${{ steps.check.outputs.version }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          OIDC_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.check.outputs.crate_exists }}" == "true" ]]; then
            token="$OIDC_TOKEN"
          else
            token="$BOOTSTRAP_TOKEN"
          fi
          if [[ -z "$token" ]]; then
            echo "::error::no crates.io credential is available for adotenv-lsp $VERSION"
            exit 1
          fi
          CARGO_REGISTRY_TOKEN="$token" bash scripts/release-publish-crate.sh adotenv-lsp
      - name: attest packaged lsp crate
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-assets/*.crate
      - name: upload lsp release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crates-lsp
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: download packaged crate assets
        if: needs.publish.outputs.has_assets == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-crates
          path: release-assets
      - name: create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            python3 - "${TAG#v}" > notes.md <<'PY'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY
            gh release create "$TAG" --verify-tag --title "adotenv ${TAG#v}" --notes-file notes.md
          else
            echo "::notice::release $TAG already exists"
          fi
          if compgen -G "release-assets/*.crate" >/dev/null; then
            gh release upload "$TAG" release-assets/* --clobber
          fi
