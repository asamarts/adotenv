name: Release

# Publishes the workspace crates when a `vX.Y.Z` tag is pushed.
#
# Existing crates are authenticated through crates.io Trusted Publishing
# (OIDC), so no registry token is stored for normal releases. crates.io does
# not support a pending trusted publisher for a brand-new crate: the first
# publish of each new crate needs a temporary CARGO_REGISTRY_TOKEN secret.
# See RELEASING.md for the one-time bootstrap and verification steps.
#
# `adotenv`, `adotenv-process` and `adotenv-cli` share one version, which must
# match the tag. `adotenv-config` and `adotenv-figment` keep their own 0.x
# versions; each one is published when its declared version is not on
# crates.io yet.
#
# Manual dispatch runs the same checks without publishing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: release quality gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify tag and workspace package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import json
          import subprocess
          import sys

          tag = sys.argv[1]
          expected = [
              "adotenv",
              "adotenv-process",
              "adotenv-config",
              "adotenv-figment",
              "adotenv-cli",
          ]
          lockstep = ["adotenv", "adotenv-process", "adotenv-cli"]
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          packages = {package["name"]: package for package in metadata["packages"]}
          missing = [name for name in expected if name not in packages]
          if missing:
              raise SystemExit(f"workspace is missing packages: {', '.join(missing)}")
          version = packages["adotenv"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match adotenv version {version}")
          for name in expected:
              package = packages[name]
              if name in lockstep and package["version"] != version:
                  raise SystemExit(
                      f"{name} is version {package['version']}, expected {version}"
                  )
              if package.get("publish") is not None:
                  raise SystemExit(f"{name} is not publishable")
              print(f"{name} {package['version']}")
          print(f"tag {tag} matches the lockstep version {version}")
          PY

      - name: plan crates.io publishes
        id: plan
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          packages="adotenv adotenv-process adotenv-config adotenv-figment adotenv-cli"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version() {
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == sys.argv[1]))' "$1" <<<"$metadata"
          }
          pending=""
          oidc_packages=""
          new_packages=""
          for package in $packages; do
            version="$(package_version "$package")"
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-release' \
              "https://crates.io/api/v1/crates/$package/$version")"
            case "$code" in
              200)
                echo "::notice::$package $version is already published"
                ;;
              404)
                crate_code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-release' \
                  "https://crates.io/api/v1/crates/$package")"
                case "$crate_code" in
                  200)
                    pending="$pending $package"
                    oidc_packages="$oidc_packages $package"
                    ;;
                  404)
                    if [[ -z "$BOOTSTRAP_TOKEN" ]]; then
                      echo "::error::$package does not exist on crates.io; Trusted Publishing cannot make its first publish. Add a temporary CARGO_REGISTRY_TOKEN secret (see RELEASING.md)."
                      exit 1
                    fi
                    pending="$pending $package"
                    new_packages="$new_packages $package"
                    ;;
                  *)
                    echo "::error::crates.io crate lookup for $package returned HTTP $crate_code"
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "::error::crates.io version lookup for $package $version returned HTTP $code"
                exit 1
                ;;
            esac
          done
          pending="${pending# }"
          oidc_packages="${oidc_packages# }"
          new_packages="${new_packages# }"
          {
            echo "packages=$pending"
            echo "oidc_packages=$oidc_packages"
            echo "new_packages=$new_packages"
            if [[ -n "$pending" ]]; then
              echo "needs_publish=true"
            else
              echo "needs_publish=false"
            fi
            if [[ -n "$oidc_packages" ]]; then
              echo "needs_oidc=true"
            else
              echo "needs_oidc=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: mint a short-lived crates.io token via OIDC
        if: steps.plan.outputs.needs_oidc == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth

      - name: publish pending crates
        if: steps.plan.outputs.needs_publish == 'true'
        env:
          PACKAGES: ${{ steps.plan.outputs.packages }}
          OIDC_PACKAGES: ${{ steps.plan.outputs.oidc_packages }}
          NEW_PACKAGES: ${{ steps.plan.outputs.new_packages }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          OIDC_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version() {
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == sys.argv[1]))' "$1" <<<"$metadata"
          }

          wait_for_index() {
            local package="$1"
            local version="$2"
            local path=""
            local body=""
            case "${#package}" in
              1) path="1/$package" ;;
              2) path="2/$package" ;;
              3) path="3/${package:0:1}/$package" ;;
              *) path="${package:0:2}/${package:2:2}/$package" ;;
            esac
            for _ in $(seq 1 90); do
              if body="$(curl -fsSL --max-time 10 -H 'User-Agent: adotenv-release' \
                "https://index.crates.io/$path")" \
                && grep -Fq "\"vers\":\"$version\"" <<<"$body"; then
                echo "::notice::$package $version is visible in the sparse index"
                return 0
              fi
              sleep 2
            done
            echo "::error::$package $version did not appear in the sparse index within 180 seconds"
            return 1
          }

          if [[ -n "$NEW_PACKAGES" && -z "$BOOTSTRAP_TOKEN" ]]; then
            echo "::error::A first publish is pending but CARGO_REGISTRY_TOKEN is not set. See RELEASING.md."
            exit 1
          fi
          if [[ -n "$OIDC_PACKAGES" && -z "$OIDC_TOKEN" ]]; then
            echo "::error::Trusted Publishing did not provide a token for: $OIDC_PACKAGES"
            exit 1
          fi

          for package in $PACKAGES; do
            version="$(package_version "$package")"
            case " $NEW_PACKAGES " in
              *" $package "*)
                token="$BOOTSTRAP_TOKEN"
                ;;
              *)
                token="$OIDC_TOKEN"
                ;;
            esac
            if [[ -z "$token" ]]; then
              echo "::error::no registry credential is available for $package"
              exit 1
            fi
            echo "::group::Publishing $package $version"
            CARGO_REGISTRY_TOKEN="$token" cargo publish -p "$package" --locked
            wait_for_index "$package" "$version"
            echo "::endgroup::"
          done

  github-release:
    name: GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists"
            exit 0
          fi
          python3 - "${TAG#v}" > notes.md <<'PY'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          print(match.group(1).strip())
          PY
          gh release create "$TAG" --verify-tag --title "adotenv ${TAG#v}" --notes-file notes.md
