name: Release

# Publishes the workspace crates when a `vX.Y.Z` tag is pushed.
#
# Existing crates are authenticated through crates.io Trusted Publishing
# (OIDC), so no registry token is stored for normal releases. crates.io does
# not support a pending trusted publisher for a brand-new crate: the first
# publish of each new crate needs a temporary CARGO_REGISTRY_TOKEN secret.
# See RELEASING.md for the one-time bootstrap and verification steps.
#
# `adotenv`, `adotenv-process` and `adotenv-cli` share one version, which must
# match the tag. `adotenv-lint`, `adotenv-config` and `adotenv-figment` keep
# their own 0.x versions; each independent crate is published when its declared
# version is not on crates.io yet.
#
# Manual dispatch runs the CI quality gate. The `publish_linter`, `publish_lsp`,
# `publish_config` and `publish_figment` inputs can additionally publish those
# independent 0.x crates through crates.io Trusted Publishing (OIDC) without a
# core tag; each path verifies its CHANGELOG.md section, packages, attests,
# uploads its .crate, and creates a permanent non-latest `<crate>-vX.Y.Z`
# GitHub Release with its `.crate` and `.crate.sha256` assets attached.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      publish_linter:
        description: Publish adotenv-lint through crates.io Trusted Publishing
        type: boolean
        default: false
      publish_lsp:
        description: Publish adotenv-lsp through crates.io Trusted Publishing
        type: boolean
        default: false
      publish_config:
        description: Publish adotenv-config through crates.io Trusted Publishing
        type: boolean
        default: false
      publish_figment:
        description: Publish adotenv-figment through crates.io Trusted Publishing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: release quality gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to crates.io
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_assets: ${{ steps.publish_crates.outputs.has_assets }}
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
      attestations: write # Sigstore build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify tag and workspace package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - "$TAG" <<'PY'
          import json
          import subprocess
          import sys

          tag = sys.argv[1]
          expected = [
              "adotenv",
              "adotenv-lint",
              "adotenv-process",
              "adotenv-config",
              "adotenv-figment",
              "adotenv-cli",
          ]
          lockstep = ["adotenv", "adotenv-process", "adotenv-cli"]
          metadata = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          packages = {package["name"]: package for package in metadata["packages"]}
          missing = [name for name in expected if name not in packages]
          if missing:
              raise SystemExit(f"workspace is missing packages: {', '.join(missing)}")
          version = packages["adotenv"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match adotenv version {version}")
          for name in expected:
              package = packages[name]
              if name in lockstep and package["version"] != version:
                  raise SystemExit(
                      f"{name} is version {package['version']}, expected {version}"
                  )
              if package.get("publish") is not None:
                  raise SystemExit(f"{name} is not publishable")
              print(f"{name} {package['version']}")
          print(f"tag {tag} matches the lockstep version {version}")
          PY
          python3 scripts/release-extract-changelog.py "${TAG#v}" >/dev/null

      - name: plan crates.io publishes
        id: plan
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          packages="adotenv adotenv-lint adotenv-process adotenv-config adotenv-figment adotenv-cli"
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version() {
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == sys.argv[1]))' "$1" <<<"$metadata"
          }
          pending=""
          oidc_packages=""
          new_packages=""
          for package in $packages; do
            version="$(package_version "$package")"
            code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-release' \
              "https://crates.io/api/v1/crates/$package/$version")"
            case "$code" in
              200)
                echo "::notice::$package $version is already published"
                ;;
              404)
                crate_code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-release' \
                  "https://crates.io/api/v1/crates/$package")"
                case "$crate_code" in
                  200)
                    pending="$pending $package"
                    oidc_packages="$oidc_packages $package"
                    ;;
                  404)
                    if [[ -z "$BOOTSTRAP_TOKEN" ]]; then
                      echo "::error::$package does not exist on crates.io; Trusted Publishing cannot make its first publish. Add a temporary CARGO_REGISTRY_TOKEN secret (see RELEASING.md)."
                      exit 1
                    fi
                    pending="$pending $package"
                    new_packages="$new_packages $package"
                    ;;
                  *)
                    echo "::error::crates.io crate lookup for $package returned HTTP $crate_code"
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "::error::crates.io version lookup for $package $version returned HTTP $code"
                exit 1
                ;;
            esac
          done
          pending="${pending# }"
          oidc_packages="${oidc_packages# }"
          new_packages="${new_packages# }"
          {
            echo "packages=$pending"
            echo "oidc_packages=$oidc_packages"
            echo "new_packages=$new_packages"
            if [[ -n "$pending" ]]; then
              echo "needs_publish=true"
            else
              echo "needs_publish=false"
            fi
            if [[ -n "$oidc_packages" ]]; then
              echo "needs_oidc=true"
            else
              echo "needs_oidc=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: mint a short-lived crates.io token via OIDC
        if: steps.plan.outputs.needs_oidc == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth

      - name: publish pending crates
        id: publish_crates
        if: steps.plan.outputs.needs_publish == 'true'
        env:
          PACKAGES: ${{ steps.plan.outputs.packages }}
          OIDC_PACKAGES: ${{ steps.plan.outputs.oidc_packages }}
          NEW_PACKAGES: ${{ steps.plan.outputs.new_packages }}
          BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          OIDC_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -euo pipefail
          metadata="$(cargo metadata --no-deps --format-version 1)"
          package_version() {
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == sys.argv[1]))' "$1" <<<"$metadata"
          }

          index_path() {
            local package="$1"
            case "${#package}" in
              1) echo "1/$package" ;;
              2) echo "2/$package" ;;
              3) echo "3/${package:0:1}/$package" ;;
              *) echo "${package:0:2}/${package:2:2}/$package" ;;
            esac
          }

          index_body() {
            local package="$1"
            curl -fsSL --max-time 10 -H 'User-Agent: adotenv-release' \
              "https://index.crates.io/$(index_path "$package")"
          }

          extract_index_checksum() {
            local version="$1"
            python3 -c '
          import json
          import sys
          version = sys.argv[1]
          for line in sys.stdin:
              try:
                  row = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if row.get("vers") == version:
                  print(row.get("cksum", ""))
                  break
          ' "$version"
          }

          wait_for_index_checksum() {
            local package="$1"
            local version="$2"
            local body=""
            local checksum=""
            for _ in $(seq 1 90); do
              if body="$(index_body "$package")"; then
                checksum="$(extract_index_checksum "$version" <<<"$body")"
                if [[ -n "$checksum" ]]; then
                  echo "::notice::$package $version is visible in the sparse index" >&2
                  printf '%s\n' "$checksum"
                  return 0
                fi
              fi
              sleep 2
            done
            echo "::error::$package $version did not appear in the sparse index within 180 seconds" >&2
            return 1
          }

          if [[ -n "$NEW_PACKAGES" && -z "$BOOTSTRAP_TOKEN" ]]; then
            echo "::error::A first publish is pending but CARGO_REGISTRY_TOKEN is not set. See RELEASING.md."
            exit 1
          fi
          if [[ -n "$OIDC_PACKAGES" && -z "$OIDC_TOKEN" ]]; then
            echo "::error::Trusted Publishing did not provide a token for: $OIDC_PACKAGES"
            exit 1
          fi

          rm -rf release-assets
          mkdir -p release-assets
          for package in $PACKAGES; do
            version="$(package_version "$package")"
            case " $NEW_PACKAGES " in
              *" $package "*)
                token="$BOOTSTRAP_TOKEN"
                ;;
              *)
                token="$OIDC_TOKEN"
                ;;
            esac
            if [[ -z "$token" ]]; then
              echo "::error::no registry credential is available for $package"
              exit 1
            fi
            echo "::group::Packaging $package $version"
            cargo package -p "$package" --locked
            crate="target/package/${package}-${version}.crate"
            if [[ ! -f "$crate" ]]; then
              echo "::error::cargo package did not produce $crate"
              exit 1
            fi
            cp "$crate" "release-assets/${package}-${version}.crate"
            (cd release-assets && sha256sum "${package}-${version}.crate" > "${package}-${version}.crate.sha256")
            local_checksum="$(sha256sum "$crate" | awk '{print $1}')"
            echo "::endgroup::"
            echo "::group::Publishing $package $version"
            CARGO_REGISTRY_TOKEN="$token" cargo publish -p "$package" --locked
            remote_checksum="$(wait_for_index_checksum "$package" "$version")"
            if [[ "$remote_checksum" != "$local_checksum" ]]; then
              echo "::error::$package $version checksum mismatch: local $local_checksum, crates.io $remote_checksum"
              exit 1
            fi
            echo "::notice::$package $version checksum matches crates.io ($local_checksum)"
            echo "::endgroup::"
          done
          if compgen -G "release-assets/*.crate" >/dev/null; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: attest packaged crates
        if: hashFiles('release-assets/*.crate') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.crate

      - name: upload release crate assets
        if: hashFiles('release-assets/*.crate') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crates
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-linter:
    name: publish adotenv-lint
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.publish_linter == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
      attestations: write # Sigstore build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify the linter version is unpublished
        id: verify
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "adotenv-lint"))'
          )"
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: adotenv-release' \
            "https://crates.io/api/v1/crates/adotenv-lint/$version")"
          if [[ "$code" == "200" ]]; then
            echo "::error::adotenv-lint $version is already published"
            exit 1
          fi
          if [[ "$code" != "404" ]]; then
            echo "::error::crates.io lookup for adotenv-lint $version returned HTTP $code"
            exit 1
          fi
          python3 scripts/release-extract-changelog.py "adotenv-lint $version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::adotenv-lint $version is unpublished and has changelog notes"
      - name: mint a short-lived crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth
      - name: package, publish and verify adotenv-lint
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: bash scripts/release-publish-crate.sh adotenv-lint
      - name: attest packaged linter crate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.crate
      - name: upload linter release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crates-linter
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-lsp:
    name: publish adotenv-lsp
    needs: [checks, publish-linter]
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_lsp == true &&
      needs.checks.result == 'success' &&
      (needs.publish-linter.result == 'success' || needs.publish-linter.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
      attestations: write # Sigstore build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify the lsp version is unpublished
        id: verify
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "adotenv-lsp"))'
          )"
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: adotenv-release' \
            "https://crates.io/api/v1/crates/adotenv-lsp/$version")"
          if [[ "$code" == "200" ]]; then
            echo "::error::adotenv-lsp $version is already published"
            exit 1
          fi
          if [[ "$code" != "404" ]]; then
            echo "::error::crates.io version lookup for adotenv-lsp $version returned HTTP $code"
            exit 1
          fi
          python3 scripts/release-extract-changelog.py "adotenv-lsp $version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::adotenv-lsp $version is unpublished and has changelog notes"
      - name: mint a short-lived crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth
      - name: package, publish and verify adotenv-lsp
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: bash scripts/release-publish-crate.sh adotenv-lsp
      - name: attest packaged lsp crate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.crate
      - name: upload lsp release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crates-lsp
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-config:
    name: publish adotenv-config
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.publish_config == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
      attestations: write # Sigstore build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify the config adapter version is unpublished
        id: verify
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "adotenv-config"))'
          )"
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: adotenv-release' \
            "https://crates.io/api/v1/crates/adotenv-config/$version")"
          if [[ "$code" == "200" ]]; then
            echo "::error::adotenv-config $version is already published"
            exit 1
          fi
          if [[ "$code" != "404" ]]; then
            echo "::error::crates.io lookup for adotenv-config $version returned HTTP $code"
            exit 1
          fi
          python3 scripts/release-extract-changelog.py "adotenv-config $version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::adotenv-config $version is unpublished and has changelog notes"
      - name: mint a short-lived crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth
      - name: package, publish and verify adotenv-config
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: bash scripts/release-publish-crate.sh adotenv-config
      - name: attest packaged config crate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.crate
      - name: upload config release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crates-config
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-figment:
    name: publish adotenv-figment
    needs: checks
    if: github.event_name == 'workflow_dispatch' && inputs.publish_figment == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.verify.outputs.version }}
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
      attestations: write # Sigstore build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: verify the figment adapter version is unpublished
        id: verify
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "adotenv-figment"))'
          )"
          code="$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: adotenv-release' \
            "https://crates.io/api/v1/crates/adotenv-figment/$version")"
          if [[ "$code" == "200" ]]; then
            echo "::error::adotenv-figment $version is already published"
            exit 1
          fi
          if [[ "$code" != "404" ]]; then
            echo "::error::crates.io lookup for adotenv-figment $version returned HTTP $code"
            exit 1
          fi
          python3 scripts/release-extract-changelog.py "adotenv-figment $version" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::adotenv-figment $version is unpublished and has changelog notes"
      - name: mint a short-lived crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: crates-auth
      - name: package, publish and verify adotenv-figment
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: bash scripts/release-publish-crate.sh adotenv-figment
      - name: attest packaged figment crate
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.crate
      - name: upload figment release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-crates-figment
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  github-release-linter:
    name: GitHub Release (adotenv-lint)
    needs: publish-linter
    if: github.event_name == 'workflow_dispatch' && inputs.publish_linter == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: download linter release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-crates-linter
          path: release-assets/adotenv-lint
      - name: create companion GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish-linter.outputs.version }}
        run: bash scripts/release-companion-github.sh adotenv-lint "$VERSION" release-assets/adotenv-lint

  github-release-lsp:
    name: GitHub Release (adotenv-lsp)
    needs: publish-lsp
    # `publish-lsp` depends on the optional `publish-linter` job; GitHub Actions
    # treats a skipped transitive ancestor as failing the default `success()`
    # guard, so guard explicitly with `!cancelled()` and `needs.publish-lsp.result`.
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_lsp == true &&
      needs.publish-lsp.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: download lsp release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-crates-lsp
          path: release-assets/adotenv-lsp
      - name: create companion GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish-lsp.outputs.version }}
        run: bash scripts/release-companion-github.sh adotenv-lsp "$VERSION" release-assets/adotenv-lsp

  github-release-config:
    name: GitHub Release (adotenv-config)
    needs: publish-config
    if: github.event_name == 'workflow_dispatch' && inputs.publish_config == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: download config release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-crates-config
          path: release-assets/adotenv-config
      - name: create companion GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish-config.outputs.version }}
        run: bash scripts/release-companion-github.sh adotenv-config "$VERSION" release-assets/adotenv-config

  github-release-figment:
    name: GitHub Release (adotenv-figment)
    needs: publish-figment
    if: github.event_name == 'workflow_dispatch' && inputs.publish_figment == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: download figment release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-crates-figment
          path: release-assets/adotenv-figment
      - name: create companion GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish-figment.outputs.version }}
        run: bash scripts/release-companion-github.sh adotenv-figment "$VERSION" release-assets/adotenv-figment

  github-release:
    name: GitHub Release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: download packaged crate assets
        if: needs.publish.outputs.has_assets == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-crates
          path: release-assets
      - name: create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if view_err="$(gh release view "$TAG" 2>&1 >/dev/null)"; then
            echo "::notice::release $TAG already exists"
          elif grep -qi "release not found" <<<"$view_err"; then
            python3 scripts/release-extract-changelog.py "${TAG#v}" > notes.md
            gh release create "$TAG" --verify-tag --title "adotenv ${TAG#v}" --notes-file notes.md
          else
            echo "::error::gh release view $TAG failed: $view_err" >&2
            exit 1
          fi
          if compgen -G "release-assets/*.crate" >/dev/null; then
            gh release upload "$TAG" release-assets/* --clobber
          fi
