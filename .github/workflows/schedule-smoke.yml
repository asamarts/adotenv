name: Schedule smoke

on:
  schedule:
    - cron: "45 17 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: scheduled trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - run: echo "scheduled trigger fired at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
