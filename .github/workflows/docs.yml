name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "book.toml"
      - "theme/**"
      - "scripts/check_docs.py"
      - "scripts/docs-smoke/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "book.toml"
      - "theme/**"
      - "scripts/check_docs.py"
      - "scripts/docs-smoke/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo install mdbook --version 0.5.4 --locked
      - run: python3 scripts/check_docs.py
      - run: mdbook build
      - name: install docs smoke dependencies
        run: npm ci --prefix scripts/docs-smoke
      - name: verify Chrome
        run: google-chrome --version
      - name: docs browser smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/docs-smoke/smoke.mjs
      - name: upload docs smoke failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-smoke-failure
          path: target/docs-smoke/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: target/book

  deploy:
    name: deploy site
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
