name: Compare smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 1 * *"

permissions:
  contents: read

concurrency:
  group: compare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: comparison harness smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path benchmarks/compare/Cargo.toml --all --check
      - run: cargo clippy --manifest-path benchmarks/compare/Cargo.toml --all-targets --locked -- -D warnings
      - run: python3 scripts/compare.py --smoke
