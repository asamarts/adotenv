name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo fmt --manifest-path conformance/rust/Cargo.toml --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --features exec --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --features load --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --features serde --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy --manifest-path conformance/rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo doc -p adotenv --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: "2000"
      - run: cargo test -p adotenv --features exec --locked
      - run: cargo test -p adotenv --features load --locked
      - run: cargo test -p adotenv --features serde --locked

  msrv:
    name: MSRV (1.81)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.81"
      # The library only: dev-dependencies may need a newer toolchain.
      - run: cargo build -p adotenv --lib --locked
      - run: cargo build -p adotenv --lib --features exec --locked
      - run: cargo build -p adotenv --lib --features load --locked
      - run: cargo build -p adotenv --lib --features serde --locked
      - run: cargo build -p adotenv --lib --no-default-features --locked
      - run: cargo build -p adotenv-process --locked

  package:
    name: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo package -p adotenv --locked
      - run: cargo bench -p adotenv --bench core --locked -- --test

  no-std:
    name: alloc-only core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
      - run: cargo build -p adotenv --lib --no-default-features --target thumbv7em-none-eabi --locked
      - run: cargo test -p adotenv --no-default-features --locked

  conformance:
    name: pinned upstream conformance observations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.10.0"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: python3 conformance/check_adotenv.py --setup
