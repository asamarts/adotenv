name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt, clippy, docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo fmt --manifest-path conformance/rust/Cargo.toml --all --check
      - run: python3 scripts/check_docs.py
      - name: lint shell scripts
        run: shellcheck scripts/*.sh
      - name: install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: lint workflows
        run: '"$(go env GOPATH)/bin/actionlint"'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv-config -p adotenv-figment --features load --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --features exec --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --features load --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --features serde --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --features load,serde --all-targets --locked -- -D warnings
      - run: cargo clippy -p adotenv --lib --no-default-features --locked -- -D warnings
      - run: cargo clippy -p adotenv --lib --no-default-features --features serde --locked -- -D warnings
      - run: cargo clippy --manifest-path conformance/rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.19.9
      - run: cargo audit --deny warnings
      - run: cargo deny check

  semver:
    name: public API semver
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-semver-checks@0.51.0
      - run: cargo semver-checks check-release --package adotenv --package adotenv-process --package adotenv-config --package adotenv-figment --package adotenv-lint

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - run: cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --locked
        env:
          PROPTEST_CASES: "2000"
      - run: cargo test -p adotenv-config --features load --locked
      - run: cargo test -p adotenv-figment --features load --locked
      - run: cargo test -p adotenv --features exec --locked
      - run: cargo test -p adotenv --features load --locked
      - run: cargo test -p adotenv --features serde --locked
      - run: cargo test -p adotenv --features load,serde --locked
      - run: cargo test -p adotenv --no-default-features --features serde --locked

  msrv:
    name: MSRV (1.81)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.81"
      # The library only: dev-dependencies may need a newer toolchain.
      - run: cargo build -p adotenv --lib --locked
      - run: cargo build -p adotenv --lib --features exec --locked
      - run: cargo build -p adotenv --lib --features load --locked
      - run: cargo build -p adotenv --lib --features serde --locked
      - run: cargo build -p adotenv --lib --features load,serde --locked
      - run: cargo build -p adotenv --lib --no-default-features --locked
      - run: cargo build -p adotenv --lib --no-default-features --features serde --locked
      - run: cargo build -p adotenv-process --locked
      - run: cargo build -p adotenv-cli --locked
      - run: cargo build -p adotenv-lint --locked
      - run: cargo build -p adotenv-figment --locked
      - run: cargo build -p adotenv-figment --features load --locked

  minimal:
    name: minimal versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Dependency minimums can predate warning-clean builds; warnings are still
    # denied in the normal lint and platform jobs.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: nightly
      # The LSP prototype has a separate 1.85 MSRV check. It is excluded here
      # because its protocol dependencies are not part of the published crates.
      - run: cargo +nightly update -Z minimal-versions
      - run: cargo +nightly test --workspace --all-features --locked --exclude adotenv-lsp

  msrv-config:
    name: MSRV adotenv-config (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.88"
      # config 0.15 requires Rust 1.88; the rest of the workspace stays on 1.81.
      - run: cargo build -p adotenv-config --locked
      - run: cargo build -p adotenv-config --features load --locked

  msrv-lsp:
    name: MSRV adotenv-lsp (1.85)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: "1.85"
      - run: cargo build -p adotenv-lsp --all-targets --locked

  package:
    name: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: cargo package -p adotenv --locked
      - name: verify packaged documentation
        run: |
          files="$(cargo package -p adotenv --locked --list)"
          grep -qx 'README.md' <<<"$files"
          grep -qx 'CHANGELOG.md' <<<"$files"
          grep -qx 'ROADMAP.md' <<<"$files"
          grep -qx 'docs/design/1.0-readiness.md' <<<"$files"
          grep -qx 'docs/design/loading.md' <<<"$files"
          grep -qx 'docs/index.md' <<<"$files"
          grep -qx 'docs/guide/getting-started.md' <<<"$files"
          for package in adotenv adotenv-process adotenv-config adotenv-figment adotenv-cli adotenv-lint adotenv-lsp; do
            files="$(cargo package -p "$package" --locked --list)"
            grep -qx 'LICENSE-APACHE' <<<"$files"
            grep -qx 'LICENSE-MIT' <<<"$files"
          done
      - name: package companion crates
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "adotenv"))')"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-ci' \
            "https://crates.io/api/v1/crates/adotenv/$version")"
          case "$code" in
            200)
              # The core version is on crates.io, so companion packages can
              # resolve their registry dependency and be fully verified.
              lint_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "adotenv-lint"))')"
              lint_code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: adotenv-ci' \
                "https://crates.io/api/v1/crates/adotenv-lint/$lint_version")"
              if [[ "$lint_code" == "200" ]]; then
                cargo package -p adotenv-cli -p adotenv-lint -p adotenv-lsp -p adotenv-process -p adotenv-config -p adotenv-figment --locked
              else
                # adotenv-lsp may depend on an unpublished linter release.
                cargo package -p adotenv-cli -p adotenv-lint -p adotenv-process -p adotenv-config -p adotenv-figment --locked
                cargo package -p adotenv-lsp --locked --list
              fi
              ;;
            404)
              # Release-prep version: verify file lists now; the tag workflow
              # performs the full verified publish after publishing adotenv.
              cargo package -p adotenv-cli -p adotenv-lint -p adotenv-lsp -p adotenv-process -p adotenv-config -p adotenv-figment --locked --list
              ;;
            *)
              echo "::error::crates.io lookup for adotenv $version returned HTTP $code"
              exit 1
              ;;
          esac
      - run: cargo bench -p adotenv --bench core --locked -- --test

  bench-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: install valgrind
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq valgrind; then
              exit 0
            fi
            echo "valgrind install failed (attempt $attempt); retrying" >&2
            sleep 10
          done
          exit 1
      - name: install gungraun-runner
        run: |
          version="$(awk '/^name = "gungraun"$/{f=1; next} f && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.lock)"
          cargo install gungraun-runner --version "$version" --locked
      - name: deterministic harness smoke
        run: cargo bench -p adotenv-bench --bench det_parse --locked -- --save-baseline=smoke
      - name: memory baseline gate
        run: |
          cargo run --release --locked -p adotenv-xtask -- memory --out target/memory-current.jsonl \
            --sizes 8,128,1k,10k,100k --shapes plain,long-line,empty \
            --modes values,load,document,resolve
          cargo run --release --locked -p adotenv-xtask -- gate \
            --baseline docs/benchmarks/memory.jsonl --current target/memory-current.jsonl

  det-perf:
    name: deterministic perf
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: bash scripts/det-perf-gate.sh

  no-std:
    name: alloc-only core
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          targets: thumbv7em-none-eabi
      - run: cargo build -p adotenv --lib --no-default-features --target thumbv7em-none-eabi --locked
      - run: cargo test -p adotenv --no-default-features --locked

  conformance:
    name: pinned upstream conformance observations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.10.0"
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - run: python3 conformance/check_adotenv.py --setup
