name: Mutants

# Bounded mutation testing for the parser, edit verification and formatting
# policy branches. Weekly and manual only; this is not a release gate.
on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: mutants (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: run bounded shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cargo mutants \
            --file src/parser.rs \
            --file src/edit.rs \
            --file src/format.rs \
            --re 'in (merge_lone_cr|valid_key_in|verify_entry_region|same_meaning)' \
            --shard "$SHARD" \
            --timeout 90 \
            --jobs 2
      - name: preserve mutant outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: ignore
          retention-days: 14
