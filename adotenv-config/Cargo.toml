[package]
name = "adotenv-config"
version = "0.9.0"
edition = "2021"
rust-version = "1.81"
description = "config crate source adapter for adotenv documents."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"
documentation = "https://docs.rs/adotenv-config"
readme = "README.md"
keywords = ["dotenv", "config", "configuration", "env"]
categories = ["config", "parser-implementations"]

[features]
default = []
load = ["adotenv/load"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
adotenv = { path = "..", version = "0.9.0" }
config = { version = "0.14", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
