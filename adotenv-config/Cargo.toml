[package]
name = "adotenv-config"
version = "0.0.0"
edition = "2021"
rust-version = "1.81"
publish = false
description = "config crate source adapter for adotenv documents."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"

[features]
default = []
load = ["adotenv/load"]

[dependencies]
adotenv = { path = "..", version = "0.6.0" }
config = { version = "0.14", default-features = false }

[lints.rust]
missing_docs = "warn"
