[book]
title = "adotenv"
description = "Literal, lossless .env parsing and editing for Rust"
authors = ["adotenv contributors"]
language = "en"
src = "docs"

[output.html]
site-url = "/adotenv/"
git-repository-url = "https://github.com/asamarts/adotenv"
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/adotenv.css"]
additional-js = ["theme/adotenv.js"]
no-section-label = true

[output.html.playground]
runnable = false

[output.html.search]
enable = true

# Pages merged into others keep working at their old addresses.
[output.html.redirect]
"/design/benchmark-plan.html" = "performance.html"
"/design/benchmark-dashboard.html" = "performance.html"

[build]
build-dir = "target/book"
create-missing = false
