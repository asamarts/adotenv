[package]
name = "adotenv-process"
version = "0.9.15"
edition = "2021"
rust-version = "1.81"
description = "Unsafe process-environment adapter for adotenv loaded values."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"
documentation = "https://docs.rs/adotenv-process"
readme = "README.md"
keywords = ["dotenv", "environment", "process", "config"]
categories = ["config", "development-tools"]

[dependencies]
adotenv = { path = "..", version = "0.9.15", features = ["load"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
