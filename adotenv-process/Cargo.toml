[package]
name = "adotenv-process"
version = "0.0.0"
edition = "2021"
rust-version = "1.81"
publish = false
description = "Unsafe process-environment adapter for adotenv loaded values."
license = "Apache-2.0 OR MIT"
repository = "https://github.com/asamarts/adotenv"

[dependencies]
adotenv = { path = "..", version = "0.5.0", features = ["load"] }

[lints.rust]
missing_docs = "warn"
