[package]
name = "adotenv-bench"
version = "0.0.0"
edition = "2021"
rust-version = "1.81"
publish = false
description = "Deterministic fixture and benchmark foundation for adotenv."
license = "Apache-2.0 OR MIT"

[lib]
bench = false

[dependencies]
adotenv = { path = "..", features = ["load"] }
dotenv = "=0.15.0"
dotenv-flow = "=0.16.2"
dotenv-parser = "=0.1.3"
dotenvs = { package = "dotenvs", version = "=0.2.2" }
dotenvy = "=0.15.7"
sha2 = "=0.11.1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
gungraun = "=0.20.0"

[[bench]]
name = "fixtures"
harness = false

[[bench]]
name = "competitors"
harness = false

[[bench]]
name = "det_parse"
harness = false

[[bin]]
name = "memory"
path = "src/bin/memory.rs"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
